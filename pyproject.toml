[tool.poetry]
name = "adv-2023"
version = "1.0.0"
description = "solutions of Advent of Code 2023"
authors = ["piotr.idzik <vil02@o2.pl>"]
readme = "README.md"
packages = [{include = "solutions"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"
numpy = "2.5.4"
sympy = "1.14.0"
matplotlib = "3.11.2"
networkx = "3.6"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-xdist = "3.8.0"
pylint = "4.1.3"
flake8 = "7.4.1"
flake8-bugbear = "26.10.27"
flake8-pytest-style = "2.2.0"
ruff = "0.17.3"
coverage = "7.17.0"
black = "26.10.1"
mypy = "2.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
